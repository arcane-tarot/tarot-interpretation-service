apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tarot-backend
  template:
    metadata:
      labels:
        app: tarot-backend
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: backend
          image: ghcr.io/arcane-tarot/tarot-interpretation-service:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tarot-backend-config
            - secretRef:
                name: tarot-backend-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tarot-backend
spec:
  selector:
    app: tarot-backend
  ports:
    - name: http
      port: 8000
      targetPort: http